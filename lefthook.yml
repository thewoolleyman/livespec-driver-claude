# lefthook.yml — livespec-driver-claude git hook configuration.
#
# Family conventions, scaled to this repo's content. Every `run:`
# field delegates to `just <target>` (the lefthook-must-delegate-to-
# just rule from livespec/SPECIFICATION/non-functional-requirements.md
# §"Toolchain pins").
#
# Authority: livespec/SPECIFICATION/contracts.md
#   §"Pre-commit step ordering" (v219) — pre-commit runs four commands
#   in order (00-install-worktree-pack, 01-lint-autofix-staged,
#   02-commit-pairs-source-and-test, 03-check-pre-commit); pre-push
#   runs 00-install-worktree-pack then 01-check-pre-push; commit-msg
#   runs no-commit-on-master then red-green-replay (v034 D3).
#   The installer runs FIRST at both gates because the
#   worktree-discipline pack is gitignored-and-installed: a worktree
#   created by raw `git worktree add` (or one predating a
#   livespec-dev-tooling pin bump) would otherwise reach the gate with
#   the pack absent or stale and fail `worktree_pack_absent` only after
#   the whole aggregate had run. The installer is idempotent, writes only
#   ignored files, installs from the package this checkout resolves, and
#   the byte-identity verifier still asserts the result.
#   Red-green-replay is enforced here fleet+adopter-wide per epic
#   livespec-gcp2 (maintainer directive 2026-06-25): a feat:/fix: commit
#   with staged `.py` follows the Red->Green ritual; the gate is a no-op
#   on commits with no staged `.py`, so a `ci:`/`docs:`/`chore:` commit
#   passes it freely.
#
# Activation: `just bootstrap` installs the canonical commit-refuse hook by
# REUSING the livespec-dev-tooling installer
# (`python -m livespec_dev_tooling.install_commit_refuse_hooks`, the SINGLE
# source of the structural hook body) as the .git/hooks/pre-commit, pre-push,
# and commit-msg hooks (refuses at the primary checkout; delegates to lefthook
# at secondary worktrees via mise). The commit-msg hook routes argv[1] (the
# commit-message file path) to the red-green-replay hook.

pre-commit:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    01-lint-autofix-staged:
      run: just lint-autofix-staged
    02-commit-pairs-source-and-test:
      run: just check-commit-pairs-source-and-test
    03-check-pre-commit:
      run: just check-pre-commit

commit-msg:
  commands:
    00-no-commit-on-master:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "master" ]; then
          printf 'ERROR: direct commits to master are forbidden; create a feature branch first\n' >&2
          printf 'Hint: git checkout -b <branch-name>\n' >&2
          exit 1
        fi
    01-red-green-replay:
      run: just check-red-green-replay {1}

pre-push:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    01-check-pre-push:
      run: just check-pre-push
